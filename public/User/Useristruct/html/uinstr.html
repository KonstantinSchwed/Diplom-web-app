<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инструкция пользователя</title>
    <link rel="stylesheet" href="/User/Useristruct/css/uinstr.css"> 
    <link rel="icon" href="/Projectresources/logo good.png" type="image/x-icon">
    <script src="/node_modules/quill/dist/quill.js"></script>
    <link rel="stylesheet" href="/node_modules/quill/dist/quill.snow.css">
    <script src="/node_modules/file-saver/dist/FileSaver.min.js"></script>
    <script src="/node_modules/docx/dist/index.iife.js"></script>
    <script src="/node_modules/mammoth/mammoth.browser.min.js"></script>
    <script defer src="/User/Useristruct/uinstr.js"></script> 
</head>
<body>
    <div id="preloader">
        <p>Загрузка. Пожалуйста, подождите</p>
        <div class="dots">
            <span>.</span>
            <span>.</span>
            <span>.</span>
        </div>
    </div>
    <header>
        <div class="loog"></div>
        <p class="logtext">МЕДИЦИНСКАЯ<br>ИНИЦИАТИВА</p>
        <p class="logtext2">ОТКРЫТОЕ АКЦИОНЕРНОЕ ОБЩЕСТВО</p>
    </header>
    <div class="zclass">
        <img src="/Projectresources/backlogo.png" alt="Логотип" class="mainclasslogo">
    </div>
    <div class="mainclass">
            <div class="main_1_1">
                <div class="starterblockname">
                    <p class="text1">Инструкция пользователя</p>
                </div>
                <div class="buttons-container">
                    <button class="buttonback">Назад в меню</button>
                </div>
            </div>
            <div class="userlogoclass">
                <p class="userlogotext">Доброе утро, Пользователь</p>
                <div class="userlogo">
                    <img class="admin-icon" src="/Projectresources/iconsmall.png" alt="Admin Icon">
                </div>
            </div>
            <div class="modal-operator-container">
                <div class="operator-container">
                    <span class="close-operator-container">&times;</span>
                    <div class="operator-info">
                        <div class="operator-user-avatar">
                            <img class="admin-icon" src="/Projectresources/iconsmall.png" alt="Admin Icon">
                        </div>
                        <div class="opertor-content">
                            <div class="operator-name">Шипович Артём Александрович</div>
                            <div class="operator-position">Администратор</div>
                        </div>
                    </div>
                    <div class="operator-chat-content">
                        В данный момент сообщений нет!
                    </div>
                    <div class="operator-input-area">
                        <textarea class="operator-message-input" placeholder="Введите сообщение"></textarea>
                        <div class="action-buttons">
                            <button class="action-button operator-close-button">Закрыть переписку</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="containerWrapper">
            <div class="container">
                <div class="maineditor">
                    <div id="buttonsContainer2" class="buttons-container2">
                     <button id="fullscreenToggle">Полноэкранный режим</button>
                 </div>
                    <div id="editor-wrapper">
                        <div id="editor-container"></div>
                    </div>
                </div>
            </div>
            <div class="adminlogoclass">
                <div class="adminlogo">
                    <img class="admin-icon2" src="/Projectresources/iconsmall.png" alt="Admin Icon">
                </div>
                <p class="adminlogotext">Администратор</p>
            </div>
        </div>
    <footer class="footer">
        <div class="clickable-footer">
            <p class="footertext">Пользовательское соглашение</p>
        </div>
    </footer>
    </div>
</body>
</html>
