<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню пользователя</title>
    <link rel="stylesheet" href="/User/Usermainmenu/css/umainmenu.css">
    <link rel="icon" href="/Projectresources/logo good.png" type="image/x-icon">
    <script defer src="/User/Usermainmenu/umainmenu.js"></script> 
</head>
<body>
    <div id="preloader">
        <p>Загрузка. Пожалуйста, подождите</p>
        <div class="dots">
            <span>.</span>
            <span>.</span>
            <span>.</span>
        </div>
    </div>
    <header>
        <div class="loog"></div>
        <p class="logtext">МЕДИЦИНСКАЯ<br>ИНИЦИАТИВА</p>
        <p class="logtext2">ОТКРЫТОЕ АКЦИОНЕРНОЕ ОБЩЕСТВО</p>
    </header>
    <div class="zclass">
        <img src="/Projectresources/backlogo.png" alt="Логотип" class="mainclasslogo">
    </div>

    <div class="mainclass">
        <div class="main_1_1">
            <p class="text1">ГЛАВНОЕ МЕНЮ ПОЛЬЗОВАТЕЛЯ</p>
        </div>
        <div class="userlogoclass">
            <p class="userlogotext">Доброе утро, Пользователь</p>
            <div class="userlogo">
                <img class="admin-icon" src="/Projectresources/iconsmall.png" alt="Admin Icon">
            </div>
        </div>
        <div class="modal-operator-container">
            <div class="operator-container">
                <span class="close-operator-container">&times;</span>
                <div class="operator-info">
                    <div class="operator-user-avatar">
                        <img class="admin-icon2" src="/Projectresources/iconsmall.png" alt="Admin Icon">
                    </div>
                    <div class="opertor-content">
                        <div class="operator-name">Шипович Артём Александрович</div>
                        <div class="operator-position">Администратор</div>
                    </div>
                </div>
                <div class="operator-chat-content">
                    В данный момент сообщений нет!
                </div>
                <div class="operator-input-area">
                    <textarea class="operator-message-input" placeholder="Введите сообщение"></textarea>
                    <div class="action-buttons">
                        <button class="action-button operator-close-button">Закрыть переписку</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="main_1_2">
            <button class="button1" id="menubuttons">Инструкция приложения</button>
            <button class="button3" id="menubuttons">Программы обучения</button>
            <button class="button4" id="menubuttons">Обратиться к администратору</button>
            <button class="button6" id="menubuttons">Личный кабинет</button>
            <button class="button7" >Выйти из кабинета</button>
            <div class="adminlogoclass">
                <div class="adminlogo">
                    <img class="admin-icon" src="/Projectresources/iconsmall.png" alt="Admin Icon">
                </div>
                <p class="adminlogotext">Администратор</p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="clickable-footer">
            <p class="footertext">Пользовательское соглашение</p>
        </div>
    </footer>
</body>
</html>
