<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест раздела</title>
    <link rel="stylesheet" href="/User/Usertest/css/utest.css">
    <link rel="icon" href="/Projectresources/logo good.png" type="image/x-icon">
    <script defer src="/User/Usertest/utest.js"></script>
</head>

<body>
    <div id="preloader">
        <p>Загрузка. Пожалуйста, подождите</p>
        <div class="dots">
            <span>.</span>
            <span>.</span>
            <span>.</span>
        </div>
    </div>
    <div class="modal-overlay" id="confirmation-modal-overlay">
        <div class="modal">
            <span class="close-modal" id="close-confirmation-modal">&times;</span>
            <p class="modal-text" id="confirmation-modal-text"></p>
            <div class="modal-buttons">
                <button class="modal-button yes" id="confirm-yes-yes">Да</button>
                <button class="modal-button no" id="cancel-yes">Нет</button>
            </div>
        </div>
    </div>
    <header>
        <div class="loog"></div>
        <p class="logtext">МЕДИЦИНСКАЯ<br>ИНИЦИАТИВА</p>
        <p class="logtext2">ОТКРЫТОЕ АКЦИОНЕРНОЕ ОБЩЕСТВО</p>
    </header>
    <div class="zclass">
        <img src="/Projectresources/backlogo.png" alt="Логотип" class="mainclasslogo">
    </div>
    <div class="mainclass">
        <div class="main_1_1">
            <p class="text1">Тест раздела: "<span class="text1span">Для справки</span>"</p>
            <div class="buttons-container">
                <button class="buttonback">Назад в меню</button>
                <button class="buttonback2">Назад</button>
            </div>
        </div>
        <div class="userlogoclass">
            <p class="userlogotext">Доброе утро, Пользователь</p>
            <div class="userlogo">
                <img class="admin-icon" src="/Projectresources/iconsmall.png" alt="Admin Icon">
            </div>
        </div>
        <div class="container">
            <div class="fullsupport">
                <div class="leftsupport">
                    <p class="testintro">Виды ответов на вопрос: <br> ⚪ Одиночный;<br> ☑️ Множественный;</p>
                </div>
                <div class="rightsupport">
                    <p class="titest">Время на тест: <span class="ttest">20</span></p>
                </div>
            </div>
            <div class="overtestcontainer">
            </div>
            <button class="endtest">Завершить и отправить тест</button>
        </div>
        <footer class="footer">
            <div class="clickable-footer">
                <p class="footertext">Пользовательское соглашение</p>
            </div>
        </footer>
    </div>
</body>

</html>
