<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="/Enteringpage/css/entering.css">
    <link rel="icon" href="/Projectresources/logo good.png" type="image/x-icon">
    <script defer src="/Enteringpage/login.min.js"></script>  
</head>
<body>
    <div id="preloader">
        <p>Загрузка. Пожалуйста, подождите</p>
        <div class="dots">
            <span>.</span>
            <span>.</span>
            <span>.</span>
        </div>
    </div>
    <header>
        <div class="loog"></div>
        <p class="logtext">МЕДИЦИНСКАЯ<br>ИНИЦИАТИВА</p>
        <p class="logtext2">ОТКРЫТОЕ АКЦИОНЕРНОЕ ОБЩЕСТВО</p>
    </header>
    <div class="zclass">
        <img src="/Projectresources/backlogo.png" alt="Логотип" class="mainclasslogo">
    </div>
    <div class="mainclass">
        <div class="main_1_1">
            <p class="text1">Веб-приложение для обучения сотрудников <br>ОАО "Медицинская-инициатива"</p>
        </div>
        <div class="main_1_2">
            <div class="entering">
                <h2 class="entertext">Вход в личный кабинет</h2>
                <div class="fiotext">
                    <label>Введите Фамилию Имя Отчество (через пробел и обязательно с заглавной буквы)</label>
                </div>
                <input type="text" placeholder="Фамилия Имя Отчество" name="fullName">
                <div class="passwordtext">
                    <label>Введите пароль</label>
                </div>
                <input type="password" placeholder="********" name="password">
                <div class="error" style="visibility: hidden;">НЕВЕРНЫЙ пароль!</div>
                <button class="button">Войти</button>
                <p class="additional">*Регистрация через администратора</p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="clickable-footer">
            <p class="footertext">Пользовательское соглашение</p>
        </div>
    </footer>
</body>
</html>
