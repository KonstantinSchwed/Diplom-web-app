<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обращения пользователей</title>
    <link rel="stylesheet" href="/Administrator/Adminmessanger/css/amessanger.css"> 
    <link rel="icon" href="/Projectresources/logo good.png" type="image/x-icon">
    <script defer src="/Administrator/Adminmessanger/amessanger.js"></script> 
</head>
<body>
    <div id="preloader">
        <p>Загрузка. Пожалуйста, подождите</p>
        <div class="dots">
            <span>.</span>
            <span>.</span>
            <span>.</span>
        </div>
    </div>
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
          <span class="close-modal" id="close-modal">&times;</span>
          <p class="modal-text" id="modal-text"></p>
          <div class="modal-buttons">
            <button class="modal-button yes" id="confirm-yes">Ок</button>
          </div>
        </div>
      </div> 
      <div class="modal-overlay" id="confirmation-modal-overlay">
        <div class="modal">
            <span class="close-modal" id="close-confirmation-modal">&times;</span>
            <p class="modal-text" id="confirmation-modal-text"></p>
            <div class="modal-buttons">
                <button class="modal-button yes" id="confirm-yes-yes">Да</button>
                <button class="modal-button no" id="cancel-yes">Нет</button>
            </div>
        </div>
    </div>
    <header>
        <div class="loog"></div>
        <p class="logtext">МЕДИЦИНСКАЯ<br>ИНИЦИАТИВА</p>
        <p class="logtext2">ОТКРЫТОЕ АКЦИОНЕРНОЕ ОБЩЕСТВО</p>
    </header>
    <div class="zclass">
        <img src="/Projectresources/backlogo.png" alt="Логотип" class="mainclasslogo">
    </div>
    <div class="mainclass">
            <div class="main_1_1">
                <div class="starterblockname">
                    <p class="text1">Обращения пользователей</p>
                </div>
                <div class="buttons-container">
                    <button class="buttonback">Назад в меню</button>
                </div>
            </div>
            <div class="containers-layout-wrapper">
            <div class="container">
                <p class="chapterintro">Входящие сообщения</p>
                <div class="incontainer">
                </div>
            </div>
            <div class="operator-container">
                <span class="close-operator-container">&times;</span>
                <div class="operator-info">
                    <div class="operator-user-avatar">
                        <img class="admin-icon" src="/Projectresources/iconsmall.png" alt="Admin Icon">
                    </div>
                    <div class="opertor-content">
                        <div class="operator-name">Шипович Артём Александрович</div>
                        <div class="operator-position">Оператор колл-центра</div>
                    </div>
                </div>
                <div class="operator-chat-content">
                    В данный момент сообщений нет!
                </div>
                <div class="operator-input-area">
                    <textarea class="operator-message-input" placeholder="Введите сообщение"></textarea>
                    <div class="action-buttons">
                        <button class="action-button operator-close-button">Закрыть переписку</button>
                        <button class="action-button operator-delete-button">Удалить переписку</button>
                    </div>
                </div>
            </div>
           </div>
            <div class="userlogoclass">
                <p class="userlogotext">Доброе утро, Администратор</p>
                <div class="userlogo">
                    <img class="admin-icon" src="/Projectresources/iconsmall.png" alt="Admin Icon">
                </div>
            </div>
    <footer class="footer">
        <div class="clickable-footer">
            <p class="footertext">Пользовательское соглашение</p>
        </div>
    </footer>
    </div>
</body>
</html>
